# Karukan IME デフォルト設定
# このファイルは ~/.config/karukan-im/config.toml にコピーして使用してください

[conversion]
# 変換ストラテジー: adaptive（動的切替）, light（軽量モデルのみ）, main（メインモデルのみ）
strategy = "adaptive"
# 変換候補数（Space押下時）
num_candidates = 9
# 周辺テキスト（カーソル左側の確定済みテキスト）を変換時のコンテキストとして使用する
use_context = true
# 変換API に渡す周辺テキストの最大文字数
max_context_length = 10
# ライブ変換で1回のGPT2変換が扱う読みの最大文字数。
# 入力をこの長さごとのチャンクに内部分割し、各チャンクを個別に変換することで
# 長文入力でも1キーあたりの変換レイテンシを一定以内に抑える。
# 各チャンクの左コンテキストは直前までのチャンクの変換結果になる。
composing_chunk_len = 30
# 旧設定。Space変換は読みの長さにかかわらず本体モデルのビーム探索を使う。
short_input_threshold = 10
# Space変換のビーム幅
beam_width = 3
# 打鍵停止後のSpace先回り計算の待ち時間(ms)。0で無効。
# 長文を含む26文×3回で、300ms待機時の最大待ち時間が24.83msとなった100msを採用。
prefetch_delay_ms = 100
# ライブ変換の本体推論がこの時間(ms)を超えたらlight_modelに自動切替(0で無効)
max_latency_ms = 100
# Model variant id or GGUF path (uses registry default if unset)
model = "jinen-v2-small-q5"
# Live-conversion adaptive fallback model (also used by strategy = "light")
light_model = "jinen-v2-xsmall-q5"
# 推論スレッド数（0 = 全コア使用）
n_threads = 4
# 起動時にライブ変換を有効にする（Ctrl+Shift+L で実行中も切替可能）
live_conversion = false
# true にすると旧Tab挙動（学習候補を避けた変換開始）に戻す
tab_skips_learning = false
# ユーザー辞書: ~/.local/share/karukan-im/user_dicts/ に辞書ファイルを配置（Mozc TSV or KRKN binary）

[learning]
# 変換学習を有効にする
enabled = true
# 学習エントリの最大数
max_entries = 10000
